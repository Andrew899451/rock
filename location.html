<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Location</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
            border: 2px solid #1a1a1a;
            z-index: 1;
        }

        /* Style for the clickable map image in the footer */
        .footer-map-img {
            width: 70px;
            height: 70px;
            border-radius: 5px;
            object-fit: cover;
            border: 2px solid #1a1a1a;
            transition: transform 0.2s;
        }
        .footer-map-img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html">Home</a>
            <a href="store.html">Store</a>
            <a href="location.html">Location</a>
        </nav>

        <main style="padding: 20px;">
            <!-- Real interactive map -->
            <div id="map"></div>
        </main>

        <footer>
            <div class="footer-left">
                <a href="index.html" style="color: black; text-decoration: none;">Home</a>
                <a href="location.html" style="color: black; text-decoration: none;">Location</a>
            </div>
            <div class="footer-info">
                Rock store:<br>
                1880 Islington Ave<br>
                Toronto, Ontario(ON), M9V 3B6<br>
                647-228-1528<br><br>
                info@rockstore.org<br>
                Copyright © 2026. Andrew Primyshev
            </div>
            <div class="footer-right">
                <div class="social-icons">𝕏 ⌾</div>
                
                <!-- UPDATED: Clickable image -->
                <a href="location.html">
                    <img src="images/map.jpg" alt="Map location" class="footer-map-img">
                </a>

            </div>
        </footer>
    </div>

    <!-- Leaflet Map Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Islington Ave, Toronto
        var map = L.map('map').setView([43.7833, -79.5333], 15);

        // Add open street map tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add a custom marker for the Rock Store
        var rockIcon = L.divIcon({
            className: 'custom-icon',
            html: '<div style="font-size: 30px;">🪨</div>',
            iconSize: [30, 30],
            iconAnchor: [15, 30]
        });

        L.marker([43.7833, -79.5333], {icon: rockIcon}).addTo(map)
            .bindPopup('<b>Rock Store</b><br>Come touch a rock.')
            .openPopup();
    </script>
</body>
</html>

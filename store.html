<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Store</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            padding: 20px;
        }
        
        .rock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .rock-item:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .rock-circle {
            width: 120px;
            height: 120px;
            background-color: #1a73e8; 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #fff;
            margin-bottom: 10px;
            overflow: hidden; 
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
        }

        /* Styling for my store rock images */
        .rock-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fills the blue circle perfectly */
        }

        .price-tag {
            background-color: #8aff4c;
            padding: 5px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px solid #1a1a1a;
            font-family: 'Oswald', sans-serif;
        }

        /* Style for the clickable map image in the footer */
        .footer-map-img {
            width: 70px;
            height: 70px;
            border-radius: 5px;
            object-fit: cover;
            border: 2px solid #1a1a1a;
            transition: transform 0.2s;
        }
        .footer-map-img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
